; Gemeinsame Multi-Board-Konfiguration:
; 1) LilyGO T-Dongle S3 (ESP32-S3, TFT ST7735, APA102 RGB, GPIO0 Button, NimBLE)
; 2) Seeed Studio XIAO nRF52840 Sense (nRF52840, PDM-Mikrofon, RGB-LED, SoftDevice S140, UF2)
; 3) Native Host Unit-Tests (21 Tests für Jiggler, Keymap DE/US & Macro-Engine)

[env:T-Dongle-S3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = dongles3
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    fastled/FastLED@^3.9.0
    h2zero/NimBLE-Arduino@^2.5.0

[env:xiaoblesense_adafruit]
platform = https://github.com/maxgerhardt/platform-nordicnrf52.git
framework = arduino
board = xiaoblesense_adafruit
upload_protocol = nrfutil
extra_scripts = post:tools/make_uf2.py
build_flags =
    -DCFG_DEBUG=0

[env:native]
platform = native
build_flags = -std=gnu++14
